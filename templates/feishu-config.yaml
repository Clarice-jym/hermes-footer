# Feishu/Lark runtime_footer config (current rich-field system)
#
# The live runtime footer supports rich fields such as:
# model, cwd, thinking, context, tokens, cost, usage, time, session
#
# Current preferred Feishu order for this user:
# model | cwd | thinking | context | tokens | cost | usage
#
# This user prefers separator: ' | '
# Feishu does not use the divider prefix in this setup.

streaming:
  enabled: true
  transport: edit

display:
  platforms:
    feishu:
      show_reasoning: false
      streaming: true
      runtime_footer:
        enabled: true
        separator: ' | '
        fields:
          - model
          - cwd
          - thinking
          - context
          - tokens
          - cost
          - usage
