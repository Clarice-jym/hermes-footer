# Discord runtime_footer config (current rich-field system)
#
# The live runtime footer supports rich fields such as:
# model, cwd, thinking, context, tokens, cost, usage, time, session
#
# Current preferred Discord order for this user:
# model | cwd | thinking | context | tokens | cost | usage
#
# This user prefers separator: ' | '
# Discord also keeps the divider prefix.

display:
  platforms:
    discord:
      show_reasoning: true
      streaming: true
      runtime_footer:
        enabled: true
        separator: ' | '
        prefix: '────────'
        fields:
          - model
          - cwd
          - thinking
          - context
          - tokens
          - cost
          - usage
