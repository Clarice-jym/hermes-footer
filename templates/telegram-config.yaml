# Telegram runtime_footer config
#
# VERSION NOTE (May 2026): The new simplified footer code only supports
# `model`, `context_pct`, and `cwd`. Fields like session/thinking/tokens/usage
# are silently ignored. Separator and prefix are also ignored.
# 
# Use this template with the NEW system by stripping unsupported fields.
# For the OLD rich system (pre-rewrite), see the commented block below.

display:
  platforms:
    telegram:
      streaming: true
      runtime_footer:
        enabled: true
        # separator: ' | '          # ignored by new code
        # prefix: '────────'        # ignored by new code
        fields:
          - model
          - context_pct
          # - session              # unsupported in new code
          # - thinking             # unsupported in new code
          # - tokens               # unsupported in new code
          # - time                 # unsupported in new code
          # - cwd                  # supported but optional

